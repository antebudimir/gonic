# gonic fork invariants — enforced by `fork-check` (see AGENTS.md)
#
# Only invariants demonstrated both ways belong here: they pass on the current
# tree, and fail when the protection is removed. Unverified guesses are worse
# than no check.
#
# Format: "path::pattern" — the "::" separator keeps colons usable on both sides.
# Patterns are grep basic regexes; paths may be globs.

# Optional; enables the upstream orientation-file guard. This fork has none.
UPSTREAM_REF="upstream/master"

# Fork features: the code that implements them, not only their tests.
MUST_EXIST=(
  "server/ctrlshare/ctrlshare.go"              # public share links + share api
  "server/ctrlsubsonic/handlers_share.go"      # createShare/getShares/updateShare/deleteShare
  "server/ctrladmin/handlers_shares.go"        # admin shares page
  "playlist/rules.go"                          # #GONIC-RULES smart playlists
  "server/ctrlsubsonic/smart_playlist.go"      # rules -> track query
  "podcast/opml.go"                            # OPML import
  "scanner/schedule.go"                        # configurable scan schedule
  "server/ctrladmin/adminui/static/style.css"  # dark admin theme (embedded)
  "server/ctrladmin/handlers.go"               # transcode cache handlers live here
  "server/ctrladmin/ctrl.go"                   # admin routes
)

# Test-deletion guards: keep the fork's regression coverage in place.
MUST_EXIST+=(
  "server/ctrlshare/ctrlshare_test.go"
  "server/ctrlsubsonic/handlers_share_test.go"
  "playlist/rules_test.go"
  "server/ctrlsubsonic/smart_playlist_test.go"
  "podcast/opml_test.go"
  "scanner/schedule_test.go"
  "server/ctrladmin/handlers_transcode_cache_test.go"
)

MUST_BE_ABSENT=()

MUST_CONTAIN=(
  # transcode cache UI is registered and served
  "server/ctrladmin/ctrl.go::/eject_transcode_cache_do"
  "server/ctrladmin/handlers.go::ServeTranscodeCacheEjectDo"
  # fork admin surfaces
  "server/ctrladmin/ctrl.go::/shares"
  "server/ctrladmin/ctrl.go::/scan_status"
  "server/ctrladmin/ctrl.go::/update_playlist_rules_do"
  # new playlists are named after the playlist (upstream #747)
  "server/ctrlsubsonic/handlers_playlist.go::playlistp.NewPath(user.ID, playlist.Name)"
  # credentials are redacted in request logs (upstream #750)
  "handlerutil/handlerutil.go::redactedURL"
)

NOT_CONTAIN=(
  # unresolved merge conflicts anywhere in the Go tree
  "**/*.go::<<<<<<<"
  "**/*.go::>>>>>>>"
  "**/*.go::^=======$"
)
